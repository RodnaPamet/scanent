# The release of scanent's image and air-gapped bundle.
#
#   build     one image per architecture, each built and smoke-tested on a
#             runner of that architecture, scanned (the Trivy and Grype
#             gates), and described by a CycloneDX SBOM made from that image
#   bundle    the air-gapped bundle from the two images and their SBOMs,
#             checked by loading it. On a pushed tag its SHA256SUMS is signed
#   publish   a pushed tag only, and only after the bundle check passed: push
#             both images and one manifest over them, sign the three by digest,
#             attach each SBOM as an attestation, and attest the build's
#             provenance. A version already in the registry is never pushed again
#   release   a pushed tag only: a GitHub release holding the bundle and its
#             SHA-256, the SBOMs, and the signed SHA256SUMS
#
# A pushed tag `v<MAJOR>.<MINOR>.<PATCH>` publishes. A manual run
# (workflow_dispatch) builds, tests and bundles, and pushes and signs nothing,
# whatever ref it is started on; so does a re-run that finds the version
# published.
#
# SIGNING IS KEYLESS. There is no signing key in this repository or its
# secrets. `cosign` asks GitHub for a token that says "this is release.yml of
# this repository, run for this tag", Sigstore's certificate authority issues
# a ten-minute certificate for that identity, and the signature is recorded in
# its public transparency log. Whoever verifies names that identity
# (docs/verify-a-release.md). A signature is made for a DIGEST, never a tag.
#
# The images are built with --provenance=false and stay plain manifests: the
# provenance attestation is made for the digest that was tested, by the job
# that pushes it, and not by a second build. No `latest` tag is ever pushed.
#
# Every action is pinned to a full commit SHA, as in ci.yml. Registry login and
# the manifest use the Docker CLI on the runner, not a third-party action.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read the repository, and nothing else. `publish` alone may write packages
# and attestations, `publish` and `bundle` alone may ask for the signing
# identity, and `release` alone may write a release.
permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/rodnapamet/scanent
  # The two tools a signature and an SBOM are made with, by version.
  COSIGN_VERSION: v3.1.4
  SYFT_VERSION: v1.57.1

jobs:
  build:
    name: Image (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version is the scanner's own. A tag that names another one fails
      # here, before anything is built.
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^export const SCANNER_VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\)';$/\1/p" packages/scanner/src/scanner-surface.ts)"
          [ -n "$version" ] || { echo "SCANNER_VERSION was not found in scanner-surface.ts" >&2; exit 1; }
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "the tag $REF_NAME does not name the scanner's version, v$version" >&2
            exit 1
          fi
          chart="$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/helm/scanent/Chart.yaml)"
          [ "$chart" = "$version" ] || { echo "the chart's appVersion is $chart, not $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the image (no push)
        env:
          DOCKER_BUILDKIT: "1"
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --provenance=false --sbom=false -f deploy/Dockerfile -t "${IMAGE_REPOSITORY}:${VERSION}-${ARCH}" .
          found="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REPOSITORY}:${VERSION}-${ARCH}")"
          [ "$found" = "linux/${ARCH}" ] || { echo "built $found, not linux/${ARCH}" >&2; exit 1; }

      - name: Smoke-test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: deploy/smoke.sh "${IMAGE_REPOSITORY}:${VERSION}-${ARCH}"

      # Blocking: CRITICAL and HIGH, fixed vulnerabilities only, no exemptions.
      - name: "Gate: Trivy scan of the image (critical+high)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          timeout: "15m"

      # A second scanner with its own database. Blocking, as in ci.yml.
      - name: "Gate: Grype scan of the image (high and above)"
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.121.3

      # The SBOM of the image that was just tested: its OS packages and the
      # packages under node_modules. Syft reads the image from the local
      # store. The action uploads and publishes nothing itself.
      - name: SBOM of the image (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          format: cyclonedx-json
          output-file: sbom/${{ matrix.arch }}.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # An SBOM that names no component is not one.
      - name: The SBOM is a CycloneDX document that lists the scanner's dependencies
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length) > 0' "sbom/${ARCH}.cdx.json" > /dev/null
          for name in zod js-yaml typescript; do
            jq -e --arg n "$name" '[.components[] | select(.name == $n)] | length > 0' "sbom/${ARCH}.cdx.json" > /dev/null \
              || { echo "the SBOM does not list $name" >&2; exit 1; }
          done

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom/${{ matrix.arch }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Save the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: docker save -o "scanent-${VERSION}-linux-${ARCH}.tar" "${IMAGE_REPOSITORY}:${VERSION}-${ARCH}"

      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: scanent-*-linux-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push the images and the manifest
    # A PUSHED tag: a manual run on a tag ref builds and bundles, and pushes nothing.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # The bundle job loads and scans with what a site would receive; a version whose bundle fails is not published.
    needs: [build, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # The signing identity (keyless), and the provenance attestation.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The images pushed are the ones that were smoke-tested and scanned.
      - name: Load both images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "scanent-${VERSION}-linux-${arch}.tar"
          done

      - name: Log in to the registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # A version is immutable: a re-run of a tag's workflow must not replace
      # published bytes with a rebuild. Asked after the login, so a private
      # package answers. Only a positive answer refuses; a first release finds nothing.
      - name: Refuse a version that is already published
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${VERSION}" > /dev/null 2>&1; then
            echo "${IMAGE_REPOSITORY}:${VERSION} is already published; a version is never pushed twice" >&2
            exit 1
          fi

      - name: Push each architecture's image
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker push "${IMAGE_REPOSITORY}:${VERSION}-${arch}"
          done

      # One manifest over the two, under the version and under MAJOR.MINOR.
      # Never `latest`: a client names a version.
      - name: Create the manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE_REPOSITORY}:${VERSION}" \
            -t "${IMAGE_REPOSITORY}:${VERSION%.*}" \
            "${IMAGE_REPOSITORY}:${VERSION}-amd64" \
            "${IMAGE_REPOSITORY}:${VERSION}-arm64"

      - name: The manifest lists exactly linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          platforms="$(docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}:${VERSION}" \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          echo "platforms: $platforms"
          [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "the manifest is not exactly the two architectures" >&2; exit 1; }

      # What was pushed, by digest: the manifest over the two, and each image.
      # The manifest's digest is read two ways, and they must agree.
      - name: Read the digests
        id: digests
        run: |
          set -euo pipefail
          is_digest() { [[ "$1" =~ ^sha256:[0-9a-f]{64}$ ]]; }
          docker buildx imagetools inspect --raw "${IMAGE_REPOSITORY}:${VERSION}" > index.json
          index="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          named="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMAGE_REPOSITORY}:${VERSION}" | jq -r '.digest')"
          is_digest "$index" || { echo "the manifest's digest could not be read" >&2; exit 1; }
          [ "$index" = "$named" ] || { echo "the manifest's digest read two ways differs: $index, $named" >&2; exit 1; }
          echo "index=$index" >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
            digest="$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' index.json)"
            is_digest "$digest" || { echo "the $arch image's digest could not be read" >&2; exit 1; }
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"

      # Keyless: the certificate names this workflow at this tag. By digest, so
      # the signature is for these bytes and not for whatever a tag names later.
      - name: Sign the manifest and both images
        env:
          INDEX: ${{ steps.digests.outputs.index }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          for digest in "$INDEX" "$AMD64" "$ARM64"; do
            cosign sign --yes "${IMAGE_REPOSITORY}@${digest}"
          done

      # Each image's SBOM, attached to that image as a signed attestation.
      - name: Attest each image's SBOM
        env:
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          test -s sboms/amd64.cdx.json
          test -s sboms/arm64.cdx.json
          cosign attest --yes --type cyclonedx --predicate sboms/amd64.cdx.json "${IMAGE_REPOSITORY}@${AMD64}"
          cosign attest --yes --type cyclonedx --predicate sboms/arm64.cdx.json "${IMAGE_REPOSITORY}@${ARM64}"

      # Provenance for the digest that was tested and pushed: which workflow,
      # at which commit, produced it. Stored with the repository's attestations
      # and beside the image.
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true

      # What a client will run, run here first: the signature verifies for the
      # identity docs/verify-a-release.md names, or the release stops.
      - name: Verify the signatures the way a client does
        env:
          INDEX: ${{ steps.digests.outputs.index }}
          AMD64: ${{ steps.digests.outputs.amd64 }}
          ARM64: ${{ steps.digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${VERSION}"
          issuer="https://token.actions.githubusercontent.com"
          for digest in "$INDEX" "$AMD64" "$ARM64"; do
            cosign verify "${IMAGE_REPOSITORY}@${digest}" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          done
          for digest in "$AMD64" "$ARM64"; do
            cosign verify-attestation --type cyclonedx "${IMAGE_REPOSITORY}@${digest}" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" > /dev/null
          done
          echo "verified: the manifest, both images and both SBOM attestations, for $identity"

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  bundle:
    name: Air-gapped bundle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The signing identity for SHA256SUMS. Asked for on a pushed tag only:
      # the two steps that use it carry that condition.
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SIGN: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images-in

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Load both images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "images-in/scanent-${VERSION}-linux-${arch}.tar"
          done

      # The SBOMs are the ones the build job made from these two images. On a
      # pushed tag the list of checksums is signed, keyless, before the archive
      # is made, so the signature travels inside the bundle.
      - name: Build the bundle
        run: |
          set -euo pipefail
          export SCANENT_SBOM_DIR="$PWD/sboms"
          if [ "$SIGN" = "true" ]; then
            export SCANENT_SIGN_CMD="cosign sign-blob --yes --bundle"
          fi
          deploy/airgap/build-bundle.sh "${VERSION}" \
            "${IMAGE_REPOSITORY}:${VERSION}-amd64" "${IMAGE_REPOSITORY}:${VERSION}-arm64" bundle-out
          if [ "$SIGN" = "true" ]; then
            test -s "bundle-out/scanent-${VERSION}-airgap/signatures/SHA256SUMS.sigstore.json"
          fi

      # The bundle as a site receives it: unpack, verify, load with no image in
      # the local store, then the smoke test of what was loaded. Every run of
      # the smoke test has no network.
      - name: Unpack, verify and load the bundle, and scan with what it loaded
        run: |
          set -euo pipefail
          docker image rm "${IMAGE_REPOSITORY}:${VERSION}-amd64" "${IMAGE_REPOSITORY}:${VERSION}-arm64"
          mkdir unpacked
          tar -xf "bundle-out/scanent-${VERSION}-airgap.tar" -C unpacked
          cd "unpacked/scanent-${VERSION}-airgap"
          # A tag's bundle must carry a signature that verifies (cosign is on
          # the path there). A manual run's bundle is not signed, and says so.
          if [ "$SIGN" = "true" ]; then
            ./verify.sh --require-signature
            ./load.sh --require-signature
          else
            ./verify.sh
            ./load.sh
          fi
          cd "$GITHUB_WORKSPACE"
          deploy/smoke.sh "${IMAGE_REPOSITORY}:${VERSION}"

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanent-${{ needs.build.outputs.version }}-airgap
          path: bundle-out/scanent-*-airgap.tar
          if-no-files-found: error
          retention-days: 30

      # The signed list and its signature, also beside the bundle: a site can
      # check them before it unpacks anything.
      - name: Upload the signed checksums
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-signature
          path: |
            bundle-out/scanent-${{ needs.build.outputs.version }}-airgap/SHA256SUMS
            bundle-out/scanent-${{ needs.build.outputs.version }}-airgap/signatures/SHA256SUMS.sigstore.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release with the bundle, its checksum, the SBOMs and the signature
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, bundle, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanent-${{ needs.build.outputs.version }}-airgap

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-signature
          path: signature

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms

      # Under names that say which version each belongs to.
      - name: Name the SBOMs and the signed checksums by version
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "sboms/${arch}.cdx.json"
            cp "sboms/${arch}.cdx.json" "scanent-${VERSION}-linux-${arch}.cdx.json"
          done
          sums="$(find signature -type f -name SHA256SUMS)"
          sig="$(find signature -type f -name SHA256SUMS.sigstore.json)"
          test -s "$sums"
          test -s "$sig"
          cp "$sums" "scanent-${VERSION}-airgap.SHA256SUMS"
          cp "$sig" "scanent-${VERSION}-airgap.SHA256SUMS.sigstore.json"

      # The checksum a site compares the archive with, in `sha256sum -c` form.
      - name: Write the bundle's SHA-256
        run: |
          set -euo pipefail
          test -s "scanent-${VERSION}-airgap.tar"
          sha256sum "scanent-${VERSION}-airgap.tar" > "scanent-${VERSION}-airgap.tar.sha256"
          cat "scanent-${VERSION}-airgap.tar.sha256"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" --verify-tag --title "scanent ${VERSION}" \
            --notes "Image: ${IMAGE_REPOSITORY}:${VERSION} (linux/amd64, linux/arm64), signed by this repository's release workflow, with an SBOM and build provenance attached. The air-gapped bundle, its SHA-256, the SBOM of each image and the signed list of the bundle's checksums are attached. docs/verify-a-release.md has the commands that check each of them." \
            "scanent-${VERSION}-airgap.tar" "scanent-${VERSION}-airgap.tar.sha256" \
            "scanent-${VERSION}-linux-amd64.cdx.json" "scanent-${VERSION}-linux-arm64.cdx.json" \
            "scanent-${VERSION}-airgap.SHA256SUMS" "scanent-${VERSION}-airgap.SHA256SUMS.sigstore.json"
